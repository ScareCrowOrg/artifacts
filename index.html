<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scareverse - Development</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ff006e, #8338ec);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 1.2em;
      color: #b0b0b0;
      margin-bottom: 30px;
    }
    .status {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 0, 110, 0.3);
      border-radius: 8px;
      padding: 20px;
      margin-top: 30px;
      text-align: left;
    }
    .status-item {
      margin: 10px 0;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .status-item.ok { color: #06ffa5; }
    .status-item.warn { color: #ffbe0b; }
    .status-item.error { color: #ff006e; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Scareverse</h1>
    <p>Development Server Running</p>
    <div class="status">
      <div class="status-item ok">✓ Vite dev server active</div>
      <div class="status-item ok">✓ HMR configured</div>
      <div class="status-item ok">✓ Frontend ready</div>
      <div class="status-item">
        <br/>
        <strong>Load your app via iframe or dynamic workspace to begin.</strong>
      </div>
    </div>
  </div>

  <script type="module">
    console.log('🔥 Scareverse dev server loaded');

    // Log HMR client status
    if (import.meta.hot) {
      console.log('✓ HMR client connected');
      import.meta.hot.on('vite:beforeUpdate', () => {
        console.log('🔄 Module updating...');
      });
    } else {
      console.warn('⚠ HMR not available');
    }
  </script>
</body>
</html>
