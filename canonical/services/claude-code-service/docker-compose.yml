version: "3.9"
services:
  claude-code-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: hub-staging.scareverse.net/registry/staging/scareverse-claude-code-service:staging20260515T062550
    container_name: scareverse-claude-code-service
    environment:
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CLAUDE_HOME: /app/claude-home
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-20}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-60}
      NODE_PATH: /usr/local/lib/node_modules
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-deepseek-v4-flash}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-deepseek-v4-flash}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-deepseek-v4-pro}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-flash}
      CLAUDE_AUTO_COMPACT_PCT_OVERRIDE: ${CLAUDE_AUTO_COMPACT_PCT_OVERRIDE:-95}
      SCARE_LOG_DESTINATION: /app/logs/service.log
    volumes:
      - claude-code-home:/app/claude-home:rw
      - C:\Users\flavi\.scareverse\staging\logs\claude-code-service:/app/logs:rw
    expose:
      - "8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - scareverse-net
volumes:
  claude-code-home: null
networks:
  scareverse-net:
    external: true
