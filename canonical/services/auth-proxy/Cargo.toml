[package]
name = "auth-proxy"
version = "0.1.0"
edition = "2021"
description = "Auth Proxy (Recepção) – validates SessionID before routing /artifacts/* to Vite"

[[bin]]
name = "auth-proxy"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["http2", "macros"] }

# HTTP client for Backend session-check calls (connection pool, streaming)
# Uses rustls to avoid native OpenSSL system dependency
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "rustls-tls"] }

# Redis client for heartbeat registration
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# JSON for error responses
serde_json = "1"

# HTTP types (for response streaming)
bytes = "1"
http = "1"
http-body-util = "0.1"

# Signal handling for graceful shutdown
tokio-util = { version = "0.7", features = ["io"] }

# WebSocket proxy support
# hyper: HTTP upgrade protocol (OnUpgrade extension for WebSocket tunneling)
hyper = { version = "1", features = ["http1"] }
# hyper-util: TokioIo wrapper to bridge hyper::upgrade::Upgraded ↔ tokio AsyncRead/AsyncWrite
hyper-util = { version = "0.1", features = ["tokio"] }

# RFC 6455 WebSocket handshake validation
# sha1: Calculate Sec-WebSocket-Accept header (required by RFC 6455 § 4.2.2)
sha1 = "0.10"
# base64: Encode SHA-1 digest for Sec-WebSocket-Accept header
base64 = "0.22"
