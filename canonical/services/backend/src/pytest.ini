[pytest]
# Pytest configuration for ScareVerse backend tests
# Ensures comprehensive error reporting in CI/CD environments

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Continue test execution even with collection errors
# This ensures all test failures are reported, not just the first one
addopts = 
    --continue-on-collection-errors
    --strict-markers
    --tb=short
    -ra

# Asyncio configuration
asyncio_mode = auto

# Test paths - including canonical cell tests
testpaths = 
    tests
    ../artifacts/canonical/cell_types/*/backend/tests

# Markers for test categorization
markers =
    asyncio: Mark tests as async
    unit: Unit tests for isolated functionality
    integration: Integration tests with external dependencies
    e2e: End-to-end tests
    endpoints: API endpoint tests
    slow: Tests that take significant time to execute

# Coverage settings (when using --cov flag)
# These are defaults and can be overridden on command line
# Example: pytest --cov=app --cov-report=html

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::pytest.PytestReturnNotNoneWarning
