version: "3.8"
services:
  redis:
    build: .
    image: hub-staging.scareverse.net/registry/staging/scareverse-redis:staging20260514T174111
    container_name: scareverse-redis-local
    ports:
      - 6380:6380
    volumes:
      - redis_local_data:/data
      - C:\Users\flavi\.scareverse\staging\logs\redis:/app/logs:rw
    environment:
      - TENANT_NAME=${TENANT_NAME:-staging}
      - REDIS_ADMIN_USERNAME=${REDIS_ADMIN_USERNAME:-admin}
      - REDIS_ADMIN_PASSWORD=${REDIS_ADMIN_PASSWORD}
      - REDIS_L1_HOST=${REDIS_L1_HOST:-localhost}
      - REDIS_L1_PORT=${REDIS_L1_PORT:-6380}
      - REDIS_L1_DB=${REDIS_L1_DB:-0}
      - REDIS_L1_PASSWORD=${REDIS_L1_PASSWORD:-scarerunner}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-20}
      - HEARTBEAT_TTL=${HEARTBEAT_TTL:-60}
      - REDIS_PORT=6380
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCARE_LOG_DESTINATION=/app/logs/service.log
    networks:
      - scareverse-net
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -p
        - "6380"
        - -a
        - ${REDIS_L1_PASSWORD:-scarerunner}
        - ping
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  scareverse-net:
    external: true
volumes:
  redis_local_data:
    driver: local
    name: scareverse_redis_local_data
