# Redis L1 Service - Standalone docker-compose
#
# Local Redis cache (L1) for artifact metadata and session data.
# Uses redis:7-alpine with password protection and AOF persistence.
#
# Usage (from project root):
#   docker-compose -f artifacts/canonical/services/redis/docker-compose.yml up -d
#   docker-compose -f artifacts/canonical/services/redis/docker-compose.yml logs -f
#   docker-compose -f artifacts/canonical/services/redis/docker-compose.yml down

version: '3.8'

services:
  redis:
    build: .
    image: localhost:5001/scareverse-redis:staging
    container_name: scareverse-redis-local
    ports:
      - "6380:6380"
    volumes:
      - redis_local_data:/data
    environment:
      # Launcher-injected variables
      - DOCKER_NETWORK=${DOCKER_NETWORK:-scareverse-net-staging}
      - TENANT_NAME=${TENANT_NAME:-staging}
      - REDIS_ADMIN_USERNAME=${REDIS_ADMIN_USERNAME:-admin}
      - REDIS_ADMIN_PASSWORD=${REDIS_ADMIN_PASSWORD}
      - REDIS_L1_HOST=${REDIS_L1_HOST:-localhost}
      - REDIS_L1_PORT=${REDIS_L1_PORT:-6380}
      - REDIS_L1_DB=${REDIS_L1_DB:-0}
      - REDIS_L1_PASSWORD=${REDIS_L1_PASSWORD:-scarerunner}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-20}
      - HEARTBEAT_TTL=${HEARTBEAT_TTL:-60}
      # Default variables
      - REDIS_PORT=6380
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - scareverse-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_L1_PASSWORD:-scarerunner}", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  scareverse-net:
    driver: bridge
    name: scareverse-net

volumes:
  redis_local_data:
    driver: local
    name: scareverse_redis_local_data
