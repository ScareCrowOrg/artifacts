version: "3.9"

# ==============================================================================
# Cloudflared Service – Standalone docker-compose
# ==============================================================================
# Exposes ScareVerse backends to the internet through a Cloudflare tunnel.
# No ports are published; all traffic flows through the Cloudflare edge network.
#
# Prerequisites:
#   docker network create scareverse-net
#   export TUNNEL_TOKEN=<your-token>   # from Cloudflare dashboard
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down
# ==============================================================================

services:
  cloudflared:
    build:
      context: ../../../..
      dockerfile: artifacts/canonical/services/cloudflared/Dockerfile
    image: localhost:5001/scareverse-cloudflared:staging
    container_name: scareverse-cloudflared

    environment:
      # ── Tunnel ───────────────────────────────────────────────────────────
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_NAME: ${TUNNEL_NAME:-scareverse-tunnel}

      # ── Redis / heartbeat ─────────────────────────────────────────────────
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
      PYTHONPATH: /app/artifacts

    volumes:
      # Artifacts (for canonical.shared.services.base_service import)
      - ../../../../artifacts:/app/artifacts:ro

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - ${DOCKER_NETWORK}

networks:
  scareverse-net:
    external: true
    name: ${DOCKER_NETWORK}
