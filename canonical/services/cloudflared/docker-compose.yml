version: "3.9"
services:
  cloudflared:
    build:
      context: ../../../..
      dockerfile: artifacts/canonical/services/cloudflared/Dockerfile
    image: hub-staging.scareverse.net/registry/staging/scareverse-cloudflared:staging20260514T042531
    container_name: scareverse-cloudflared
    environment:
      INGRESS_RULES: ${INGRESS_RULES:-}
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
      PYTHONPATH: /app/artifacts
      SCARE_LOG_DESTINATION: /app/logs/service.log
    volumes:
      - ../../../../artifacts:/app/artifacts:ro
      - C:\Users\flavi\.scareverse\staging\logs\cloudflared:/app/logs:rw
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - scareverse-net
networks:
  scareverse-net:
    external: true
