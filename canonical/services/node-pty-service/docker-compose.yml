version: "3.9"
services:
  node-pty-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: hub-staging.scareverse.net/registry/staging/scareverse-node-pty-service:staging20260516T051806
    container_name: scareverse-node-pty-worker
    environment:
      PORT: ${PORT:-8000}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ARTIFACTS_PATH: /app/artifacts
      SHELL: /bin/bash
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-20}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-60}
      SCARE_LOG_DESTINATION: /app/logs/service.log
    volumes:
      - ../../../../artifacts/shared:/app/artifacts/shared:ro
      - ../../../../artifacts/canonical:/app/artifacts/canonical:ro
      - ../../../../artifacts/runtime:/app/artifacts/runtime:ro
      - ../../../../artifacts/sandbox:/app/artifacts/sandbox:ro
      - C:\Users\flavi\.scareverse\staging\logs\node-pty-service:/app/logs:rw
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - scareverse-net
networks:
  scareverse-net:
    external: true
