version: "3.9"

# ==============================================================================
# Ollama Infrastructure Service with FastAPI Wrapper
# ==============================================================================
# Two-tier service:
#   1. ollama-raw: Raw Ollama container (GPU inference)
#   2. ollama-wrapper: FastAPI wrapper with Redis heartbeat registration
#
# The wrapper:
#   - Runs on port 11434 (externally visible)
#   - Proxies requests to ollama-raw:11434
#   - Registers heartbeat to Redis L1 (state:service:ollama:available)
#   - Enables GateKeeper to detect service health via Redis (no HTTP probes needed)
#
# GateKeeper routes "ollama_generate" / "ollama_chat" jobs to wrapper via HTTP.
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed
#   - External network scareverse-net created:
#       docker network create scareverse-net
#   - .env file with REDIS_L1_HOST, REDIS_L1_PASSWORD, OLLAMA_MODELS_PATH
# ==============================================================================

services:

  ollama-raw:
    image: ollama/ollama:latest
    container_name: scareverse-ollama-raw
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: /root/.ollama

    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_PATH:-/root/.ollama}
        target: /root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Internal only - no port exposure
    expose:
      - "11434"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - ${DOCKER_NETWORK}

  ollama-wrapper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scareverse-ollama-service
    depends_on:
      - ollama-raw
    environment:
      OLLAMA_HOST: "http://ollama-raw:11434"
      OLLAMA_REQUEST_TIMEOUT: "120"
      PYTHONPATH: /app/artifacts
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      SERVICE_HOST: "0.0.0.0"
      SERVICE_PORT: "11434"
      LOG_LEVEL: "INFO"

      # Heartbeat (Launcher-injected for service availability tracking)
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-180}

    volumes:
      # Artifacts (for canonical.shared.services.base_service import)
      - ../../../../artifacts:/app/artifacts:ro

    ports:
      - "11434:11434"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health"]
      interval: 30s
      timeout: 15s
      start_period: 30s
      retries: 3

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - ${DOCKER_NETWORK}

networks:
  scareverse-net:
    external: true
    name: ${DOCKER_NETWORK}
