version: "3.9"

# ==============================================================================
# Ollama Infrastructure Service
# ==============================================================================
# Single container: ollama-raw with integrated heartbeat registration
#
# Architecture:
#   1. Dockerfile.raw: extends ollama/ollama with heartbeat.py + entrypoint-raw.sh
#   2. entrypoint-raw.sh: pre-pulls models, starts heartbeat, runs Ollama
#   3. heartbeat.py: registers state:service:ollama:available in Redis L1
#   4. GateKeeper workers call ollama-raw:11434 directly (no proxy layer)
#
# Volume mount: models cached locally at OLLAMA_MODELS_PATH (mounted volume)
#   First start: downloads all 7 models (~40GB total), ~30-45 min
#   Subsequent starts: instant (uses cached models)
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed
#   - External network scareverse-net created:
#       docker network create scareverse-net
# ==============================================================================

volumes:
  ollama-models:
    driver: local

services:

  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost:5001/scareverse-ollama:staging20260422T003044
    container_name: scareverse-ollama-raw
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: /root/.ollama

      # Python path for heartbeat.py imports
      PYTHONPATH: /app/artifacts

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Redis L1 (for heartbeat registration)
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}

      # Heartbeat configuration (Launcher-injected for service availability tracking)
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-180}

    volumes:
      # Artifacts directories (for BaseService heartbeat imports)
      - ../../../../artifacts/canonical:/app/artifacts/canonical:ro
      - ../../../../artifacts/shared:/app/artifacts/shared:ro

      # Named volume for model cache (shared across all tenants)
      # First start: downloads all 7 Ollama models (~40GB total)
      # Subsequent starts: instant (uses cached models)
      # Storage: managed by Docker in C:\ProgramData\Docker\volumes\...
      - ollama-models:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Expose port 11434 for GateKeeper workers
    ports:
      - "11434:11434"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
