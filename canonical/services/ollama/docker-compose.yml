version: "3.9"
volumes:
  ollama-models:
    driver: local
services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    image: hub-staging.scareverse.net/registry/staging/scareverse-ollama:staging20260601T012431
    container_name: scareverse-ollama-raw
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama
      PYTHONPATH: /app/artifacts
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-180}
      SCARE_LOG_DESTINATION: /app/logs/service.log
    volumes:
      - ../../../../artifacts/canonical:/app/artifacts/canonical:ro
      - ../../../../artifacts/shared:/app/artifacts/shared:ro
      - ollama-models:/root/.ollama
      - C:\Users\flavi\.scareverse\staging\logs\ollama:/app/logs:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    ports:
      - 11434:11434
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:11434/api/version
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - scareverse-net
networks:
  scareverse-net:
    external: true
