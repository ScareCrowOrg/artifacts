services:
  stable-diffusion:
    container_name: scareverse-sd-service
    build:
      context: .
      dockerfile: Dockerfile
    image: hub-staging.scareverse.net/registry/staging/scareverse-stable-diffusion:staging20260521T223718
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/artifacts
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-180}
      SCARE_LOG_DESTINATION: /app/logs/service.log
    volumes:
      - ../../../../artifacts:/app/artifacts:ro
      - sd-models:/root/.cache/huggingface
      - C:\Users\flavi\.scareverse\staging\logs\stable-diffusion:/app/logs:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    shm_size: 2gb
    ports:
      - 9090:9090
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9090/health
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - scareverse-net
networks:
  scareverse-net:
    external: true
volumes:
  sd-models:
    driver: local
