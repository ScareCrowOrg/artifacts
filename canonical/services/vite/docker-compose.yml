# Vite Service - Standalone docker-compose
#
# Runs the Vite dev server for on-demand TypeScript/Vue compilation.
# HMR (Hot Module Replacement) enabled for live file watching.
#
# Usage (from project root):
#   docker-compose -f artifacts/canonical/services/vite/docker-compose.yml build
#   docker-compose -f artifacts/canonical/services/vite/docker-compose.yml up -d
#   docker-compose -f artifacts/canonical/services/vite/docker-compose.yml logs -f
#   docker-compose -f artifacts/canonical/services/vite/docker-compose.yml down

version: '3.8'

services:
  vite:
    container_name: scareverse-vite
    build:
      context: ../../../..
      dockerfile: artifacts/canonical/services/vite/Dockerfile
    image: scareverse/vite:latest

    ports:
      - "5052:5052"

    volumes:
      - ../../../../artifacts/canonical:/app/artifacts/canonical:rw
      - ../../../../artifacts/runtime:/app/artifacts/runtime:rw
      - ../../../../artifacts/sandbox:/app/artifacts/sandbox:rw
      - ../../../../artifacts/shared:/app/artifacts/shared:rw
      - ../../../../artifacts/package.json:/app/artifacts/package.json:ro
      - ../../../../artifacts/vite.config.ts:/app/artifacts/vite.config.ts:ro

    environment:
      - NODE_ENV=development
      # PYTHONPATH enables entrypoint.py to import canonical.shared.services.base_service
      - PYTHONPATH=/app/artifacts

      # Vite HMR (Hot Module Replacement)
      - VITE_HMR_HOST=${VITE_HMR_HOST:-localhost}
      - VITE_HMR_PORT=${VITE_HMR_PORT:-5052}
      - VITE_HMR_PROTOCOL=${VITE_HMR_PROTOCOL:-ws}

      # CORS
      - VITE_CORS_ORIGINS=${VITE_CORS_ORIGINS:-http://localhost:8000,http://localhost:5173,http://localhost:5050}

      # API references (for generated viewers)
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_SCARERUNNER_URL=${VITE_SCARERUNNER_URL}
      - VITE_CENTRALHUB_URL=${VITE_CENTRALHUB_URL}

      # Performance tracing (disabled by default)
      - VITE_TRACE=${VITE_TRACE:-false}
      - VITE_TRACE_RESOLVE=${VITE_TRACE_RESOLVE:-false}
      - VITE_TRACE_LOAD=${VITE_TRACE_LOAD:-false}
      - VITE_DEBUG=${VITE_DEBUG:-false}

    networks:
      - scareverse-net

    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:5052/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  scareverse-net:
    external: true
