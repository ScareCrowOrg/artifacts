services:
  traefik:
    build:
      context: .
      dockerfile: Dockerfile
    image: hub-staging.scareverse.net/registry/staging/scareverse-traefik:staging20260530T041927
    container_name: scareverse-traefik-worker
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_ID: ${WORKER_ID:-traefik}
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-20}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-60}
      SERVICE_DISCOVERY_INTERVAL: ${SERVICE_DISCOVERY_INTERVAL:-15}
      PYTHONPATH: /app/artifacts
      SCARE_LOG_DESTINATION: /app/logs/service.log
    volumes:
      - ./traefik.yml:/app/traefik.yml:ro
      - ../../../../artifacts:/app/artifacts:ro
      - C:\Users\flavi\.scareverse\staging\logs\traefik:/app/logs:rw
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - scareverse-net
networks:
  scareverse-net:
    external: true
