# ==============================================================================
# Traefik Static Configuration (traefik.yml)
# ==============================================================================
# Defines entrypoints, logging, API, and File provider for service discovery.
# This file is loaded at startup and cannot be changed without restarting Traefik.
#
# Dynamic configuration (routes, services, middlewares) is generated by
# service-discovery.py from Redis L1 heartbeat keys and written to
# /app/traefik-services.yml (watched by the File provider below).
# ==============================================================================

# ── API & Dashboard ────────────────────────────────────────────────────────────
api:
  insecure: true   # Dashboard accessible at http://localhost:8080/dashboard
  dashboard: true

# ── Ping endpoint (used by healthcheck) ───────────────────────────────────────
ping: {}

# ── Entrypoints ───────────────────────────────────────────────────────────────
entryPoints:
  http:
    address: ":80"
    forwardedHeaders:
      insecure: true  # Trust headers from Cloudflare (in dev; restrict in prod)

  websecure:
    address: ":443"
    forwardedHeaders:
      insecure: true  # Trust X-Forwarded-* headers from Cloudflare

  traefik:
    address: ":8080"

# ── Logging ───────────────────────────────────────────────────────────────────
log:
  filePath: /app/logs/traefik.log
  level: DEBUG  # Changed from INFO to DEBUG for troubleshooting
  format: json

accessLog:
  filePath: /app/logs/access.log
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep

# ── Providers: File (service-discovery.py writes this file) ───────────────────
providers:
  file:
    # Dynamic config generated by service-discovery.py from Redis L1 heartbeats
    filename: /app/traefik-services.yml
    # Hot-reload routes when file changes (no restart needed)
    watch: true
