version: "3.9"

# ==============================================================================
# Nginx Unity Service Worker – Standalone docker-compose
# ==============================================================================
# Nginx Unit reverse proxy with dynamic route registration via HTTP API.
# Routes for vite (/) and backend (/api) are registered after services start
# via the Node.js orchestrator sidecar polling Redis heartbeat keys.
#
# Prerequisites:
#   docker network create scareverse-net
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down
# ==============================================================================

services:
  nginx-unity:
    build:
      context: .
      dockerfile: Dockerfile
    image: localhost:5001/scareverse-nginx-unity:staging
    container_name: scareverse-nginx-unity

    environment:
      # ── Tunnel FQDN (injected by orchestration Phase 7) ───────────────────
      # Set to the Cloudflare tunnel subdomain (e.g. planet.scareverse.net).
      TUNNEL_FQDN: ${TUNNEL_FQDN:-}

      # ── Legacy upstreams (centralhub, gatekeeper, scarerunner) ────────────
      # Vite and Backend routes are registered dynamically via Unit API.
      CENTRALHUB_UPSTREAM: ${CENTRALHUB_UPSTREAM:-centralhub:5051}
      FRONTEND_UPSTREAM: ${FRONTEND_UPSTREAM:-vite-frontend:5173}
      SCARERUNNER_UPSTREAM: ${SCARERUNNER_UPSTREAM:-scarerunner:5050}
      GATEKEEPER_UPSTREAM: ${GATEKEEPER_UPSTREAM:-gatekeeper:8000}

      # ── Service identification ────────────────────────────────────────────────
      WORKER_ID: ${WORKER_ID:-nginx-unity}

      # ── Redis / heartbeat ──────────────────────────────────────────────────
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-20}
      HEARTBEAT_TTL: ${HEARTBEAT_TTL:-60}

      # ── Python path (BaseService import) ────────────────────────────────────
      PYTHONPATH: /app/artifacts

    volumes:
      # Artifacts (for canonical.shared.services.base_service import)
      - ../../../../artifacts:/app/artifacts:ro

    # Expose Nginx Unit HTTP and API ports.
    # Port 80 on host maps to Nginx Unit HTTP port 80 inside container (reverse proxy requests).
    # Port 8081 on host maps to Nginx Unit API port 8080 inside container (route registration).
    ports:
      - "80:80"
      - "${NGINX_UNIT_API_PORT:-8081}:8080"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
