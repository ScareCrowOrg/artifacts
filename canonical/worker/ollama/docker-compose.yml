version: "3.9"

# ==============================================================================
# Ollama Standalone Worker
# ==============================================================================
# Single self-contained service running:
#   - Ollama LLM inference (port 11434, internal)
#   - Worker HTTP API (port 8080, called by GateKeeper)
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed
#   - External network scareverse-net created:
#       docker network create scareverse-net
#   - .env file with REDIS_L1_HOST, REDIS_L1_PASSWORD, etc.
#
# Windows model cache path (customize for your username):
#   OLLAMA_MODELS_PATH=C:\Users\{USERNAME}\.ollama
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # Ollama Worker – Combined Ollama LLM + HTTP Worker API
  # Runs both services in single container for unified orchestration
  # --------------------------------------------------------------------------
  ollama:
    build: .
    image: scareverse-ollama-worker:latest
    container_name: scareverse-ollama
    runtime: nvidia
    environment:
      # GPU Configuration
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: /root/.ollama

      # Redis L1 (local queue) – Worker consumes jobs
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}

      # Worker HTTP config
      WORKER_ID: ${WORKER_ID:-ollama-worker-01}
      WORKER_PORT: ${OLLAMA_WORKER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # Persistent Ollama model storage – bind mount for Windows
      # Windows path: C:\Users\{USERNAME}\.ollama
      # Container path: /root/.ollama
      # ⚠️ REQUIRED on Windows: Set OLLAMA_MODELS_PATH in .env
      - type: bind
        source: ${OLLAMA_MODELS_PATH:-/root/.ollama}
        target: /root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
