version: "3.9"

# ==============================================================================
# Ollama Standalone Worker Stack
# ==============================================================================
# Contains two services:
#   1. ollama        – Official Ollama LLM inference service (GPU)
#   2. ollama-worker – Stateless HTTP service (POST /process called by GateKeeper)
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed
#   - External network scareverse-net created:
#       docker network create scareverse-net
#   - .env file with OLLAMA_MODELS_PATH set to Windows Ollama cache
#
# Windows model cache path (customize for your username):
#   OLLAMA_MODELS_PATH=C:\Users\{USERNAME}\.ollama
#
# GateKeeper integration:
#   GateKeeper routes ollama_generate / ollama_chat jobs to:
#     http://scareverse-ollama-worker:9000/process
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # Ollama LLM Service (GPU)
  # Official image – no ports exposed to host (internal network only)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: scareverse-ollama
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: /root/.ollama
    volumes:
      # Persistent model storage – bind mount to Windows Ollama cache directory
      # Windows path: C:\Users\{USERNAME}\.ollama
      # Container path: /root/.ollama
      # ⚠️ REQUIRED on Windows: Set OLLAMA_MODELS_PATH in your .env file
      # ⚠️ Default /root/.ollama only works on Linux hosts
      - type: bind
        source: ${OLLAMA_MODELS_PATH:-/root/.ollama}
        target: /root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - scareverse-net

  # ----------------------------------------------------------------------------
  # Ollama Worker (Stateless HTTP)
  # Receives POST /process from GateKeeper, calls Ollama, returns result.
  # GateKeeper handles all queue management and result persistence.
  # ----------------------------------------------------------------------------
  ollama-worker:
    build: .
    image: scareverse-worker-ollama:latest
    container_name: scareverse-ollama-worker
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Ollama service endpoint (internal Docker network DNS)
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_REQUEST_TIMEOUT: ${OLLAMA_REQUEST_TIMEOUT:-120}

      WORKER_ID: ${WORKER_ID:-ollama-worker-01}
      WORKER_PORT: "9000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # No ports: exposed to host – GateKeeper reaches via Docker network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
