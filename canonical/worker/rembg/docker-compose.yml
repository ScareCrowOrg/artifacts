version: "3.9"

services:
  rembg-worker:
    build: .
    image: scareverse-worker-rembg:latest
    container_name: scareverse-worker-rembg
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REMBG_MODEL_NAME: ${REMBG_MODEL_NAME:-u2net}
      REMBG_CACHE_DIR: ${REMBG_CACHE_DIR:-/root/.u2net}
      ONNX_EXECUTION_PROVIDER: ${ONNX_EXECUTION_PROVIDER:-CPUExecutionProvider}
    volumes:
      - rembg-model-cache:/root/.u2net
    networks:
      - scareverse-net

volumes:
  rembg-model-cache:

networks:
  scareverse-net:
    external: true
