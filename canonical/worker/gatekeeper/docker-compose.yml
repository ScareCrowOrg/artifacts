version: "3.9"

services:
  gatekeeper:
    build:
      context: ../..  # Build context is artifacts/canonical/ to include job-types/
      dockerfile: worker/gatekeeper/Dockerfile
    image: scareverse-worker-gatekeeper:latest
    container_name: scareverse-gatekeeper
    restart: unless-stopped
    environment:
      # Redis L1 – ScareRunner (owner/local)
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}

      # CentralHub – L2 access via HTTP (no direct Redis credentials needed)
      CENTRALHUB_URL: ${CENTRALHUB_URL:-http://centralhub:8080}
      CENTRALHUB_SERVICE_TOKEN: ${CENTRALHUB_SERVICE_TOKEN:-internal-gatekeeper-token}

      # Atomic worker endpoints (override JSON defaults from artifacts/canonical/job-types/)
      WORKER_REMBG_REMOVEBACKGROUND_ENDPOINT: ${WORKER_REMBG_REMOVEBACKGROUND_ENDPOINT:-http://scareverse-worker-rembg:9000}
      WORKER_OLLAMA_GENERATE_ENDPOINT: ${WORKER_OLLAMA_GENERATE_ENDPOINT:-http://scareverse-ollama-worker:8080}
      WORKER_OLLAMA_CHAT_ENDPOINT: ${WORKER_OLLAMA_CHAT_ENDPOINT:-http://scareverse-ollama-worker:8080}
      WORKER_SD_GENERATE_ENDPOINT: ${WORKER_SD_GENERATE_ENDPOINT:-http://scareverse-sd-worker:8080}
      WORKER_INSTANTMESH_ENDPOINT: ${WORKER_INSTANTMESH_ENDPOINT:-http://scareverse-worker-instantmesh:8000}

      # Pooling strategy
      BRPOP_L1_TIMEOUT: ${BRPOP_L1_TIMEOUT:-1}
      BRPOP_L2_TIMEOUT: ${BRPOP_L2_TIMEOUT:-20}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
