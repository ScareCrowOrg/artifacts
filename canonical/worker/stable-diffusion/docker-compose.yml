version: "3.9"

# ==============================================================================
# Stable Diffusion Standalone Worker Stack
# ==============================================================================
# Contains two services:
#   1. scarenode-sd  – GPU-accelerated SD API (FastAPI + diffusers + SDXL)
#   2. sd-worker     – Stateless HTTP service (POST /process called by GateKeeper)
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed (8-10GB VRAM minimum for SDXL)
#   - External network scareverse-net created:
#       docker network create scareverse-net
#   - .env file with HF_HUB_CACHE_PATH set to Windows HuggingFace cache
#
# Windows HuggingFace cache path (customize for your setup):
#   HF_HUB_CACHE_PATH=C:\Users\{USERNAME}\.cache\huggingface
#
# GateKeeper integration:
#   GateKeeper routes sd_generate jobs to:
#     http://scareverse-sd-worker:9000/process
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # ScareNode-SD: Stable Diffusion GPU API Service
  # Built from infrastructure/stable-diffusion/ – FastAPI + diffusers + SDXL
  # Port 9090 is internal only (no host exposure)
  # ----------------------------------------------------------------------------
  scarenode-sd:
    build:
      context: ../../infrastructure/stable-diffusion
      dockerfile: Dockerfile
    image: scareverse/scarenode-sd:latest
    container_name: scarenode-sd
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
    volumes:
      # HuggingFace model cache – bind mount to Windows path for model persistence
      # Windows path: C:\Users\{USERNAME}\.cache\huggingface
      # Container path: /root/.cache/huggingface
      # ⚠️ REQUIRED on Windows: Set HF_HUB_CACHE_PATH in your .env file
      # ⚠️ Default /root/.cache/huggingface only works on Linux hosts
      - type: bind
        source: ${HF_HUB_CACHE_PATH:-/root/.cache/huggingface}
        target: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - scareverse-net

  # ----------------------------------------------------------------------------
  # SD Worker (Stateless HTTP)
  # Receives POST /process from GateKeeper, calls ScareNode-SD, returns result.
  # GateKeeper handles all queue management and result persistence.
  # ----------------------------------------------------------------------------
  sd-worker:
    build: .
    image: scareverse-worker-sd:latest
    container_name: scareverse-sd-worker
    depends_on:
      scarenode-sd:
        condition: service_healthy
    environment:
      # SD service endpoint (internal Docker network DNS)
      SD_HOST: http://scarenode-sd:9090
      SD_REQUEST_TIMEOUT: ${SD_REQUEST_TIMEOUT:-300}
      SD_MODEL: ${SD_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}

      WORKER_ID: ${WORKER_ID:-sd-worker-01}
      WORKER_PORT: "9000"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # No ports: exposed to host – GateKeeper reaches via Docker network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
