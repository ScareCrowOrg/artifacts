version: "3.9"

# ==============================================================================
# Stable Diffusion Standalone Worker
# ==============================================================================
# Single self-contained service running:
#   - Stable Diffusion GPU API (port 9090, internal)
#   - Worker HTTP API (port 8080, called by GateKeeper)
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed (8-10GB VRAM minimum for SDXL)
#   - External network scareverse-net created:
#       docker network create scareverse-net
#   - .env file with HF_HUB_CACHE_PATH set to Windows HuggingFace cache
#
# Windows HuggingFace cache path (customize for your setup):
#   HF_HUB_CACHE_PATH=C:\Users\{USERNAME}\.cache\huggingface
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # Stable Diffusion Worker – Combined SD API + HTTP Worker
  # Runs both services in single container for unified orchestration
  # --------------------------------------------------------------------------
  stable-diffusion:
    build: .
    image: scareverse-sd-worker:latest
    container_name: scareverse-stable-diffusion
    runtime: nvidia
    environment:
      # GPU Configuration
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

      # HuggingFace model cache
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"

      # Redis L1 (local queue) – Worker consumes jobs
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}

      # Worker HTTP config
      WORKER_ID: ${WORKER_ID:-sd-worker-01}
      WORKER_PORT: ${SD_WORKER_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # HuggingFace model cache – bind mount for Windows
      # Windows path: C:\Users\{USERNAME}\.cache\huggingface
      # Container path: /root/.cache/huggingface
      # ⚠️ REQUIRED on Windows: Set HF_HUB_CACHE_PATH in .env
      - type: bind
        source: ${HF_HUB_CACHE_PATH:-/root/.cache/huggingface}
        target: /root/.cache/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Shared memory for PyTorch tensor operations (required for SDXL)
    shm_size: "2gb"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5

    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
