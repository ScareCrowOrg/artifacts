version: "3.9"

# ==============================================================================
# Stable Diffusion Standalone Worker Stack
# ==============================================================================
# Contains two services:
#   1. scarenode-sd    – GPU-accelerated SD API (FastAPI + diffusers + SDXL)
#   2. sd-consumer     – Python queue consumer (reads Redis, calls SD API)
#
# Usage:
#   docker-compose up -d
#   docker-compose down
#
# Prerequisites:
#   - NVIDIA Container Toolkit installed (8-10GB VRAM minimum for SDXL)
#   - External network scareverse-net created:
#       docker network create scareverse-net
#   - .env file with REDIS_L1_HOST, REDIS_L1_PASSWORD, HF_HUB_CACHE, etc.
#
# Windows HuggingFace cache path (customize for your setup):
#   HF_HUB_CACHE_PATH=C:\Users\{USERNAME}\.cache\huggingface
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # ScareNode-SD: Stable Diffusion GPU API Service
  # Built from infrastructure/stable-diffusion/ – FastAPI + diffusers + SDXL
  # Port 9090 is internal only (no host exposure)
  # ----------------------------------------------------------------------------
  scarenode-sd:
    build:
      context: ../../infrastructure/stable-diffusion
      dockerfile: Dockerfile
    image: scareverse/scarenode-sd:latest
    container_name: scarenode-sd
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # HuggingFace model cache (bind mount from host for persistence)
      HF_HUB_CACHE: /root/.cache/huggingface
      HF_HUB_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
    volumes:
      # HuggingFace model cache – bind mount to Windows path for model persistence
      # Windows path: C:\Users\{USERNAME}\.cache\huggingface
      # Container path: /root/.cache/huggingface
      # ⚠️ REQUIRED on Windows: Set HF_HUB_CACHE_PATH in your .env file
      # ⚠️ Default /root/.cache/huggingface only works on Linux hosts
      - type: bind
        source: ${HF_HUB_CACHE_PATH:-/root/.cache/huggingface}
        target: /root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Shared memory for PyTorch tensor operations (required for SDXL)
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - scareverse-net

  # ----------------------------------------------------------------------------
  # SD Queue Consumer (Python)
  # Reads jobs from Redis queue and forwards to ScareNode-SD service
  # ----------------------------------------------------------------------------
  sd-consumer:
    build: .
    image: scareverse-worker-sd-consumer:latest
    container_name: scareverse-sd-consumer
    depends_on:
      scarenode-sd:
        condition: service_healthy
    environment:
      # Redis L1 (local queue)
      REDIS_L1_HOST: ${REDIS_L1_HOST:-redis-local}
      REDIS_L1_PORT: ${REDIS_L1_PORT:-6380}
      REDIS_L1_PASSWORD: ${REDIS_L1_PASSWORD:-scarerunner}
      REDIS_L1_DB: ${REDIS_L1_DB:-0}

      # Job queue config
      JOB_QUEUE: ${SD_JOB_QUEUE:-scareverse:sd-jobs:queue}
      RESULTS_KEY_PREFIX: ${SD_RESULTS_PREFIX:-scareverse:sd-results}
      BRPOP_TIMEOUT: ${BRPOP_TIMEOUT:-300}
      RESULT_KEY_TTL: ${SD_RESULT_TTL:-120}

      # SD service endpoint (internal Docker network DNS)
      SD_HOST: http://scarenode-sd:9090
      SD_REQUEST_TIMEOUT: ${SD_REQUEST_TIMEOUT:-300}
      SD_MODEL: ${SD_MODEL:-stabilityai/stable-diffusion-xl-base-1.0}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - scareverse-net

networks:
  scareverse-net:
    external: true
